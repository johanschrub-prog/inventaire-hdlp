<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>INVENTAIRE HDLP</title>

<style>

body{
font-family:Segoe UI,sans-serif;
margin:0;
background:#f5f6f8;
}

header{
background:#0a66ff;
color:white;
padding:15px;
text-align:center;
}

.tabs{
display:flex;
flex-wrap:wrap;
gap:5px;
padding:10px;
background:white;
}

.tab{
padding:8px;
border:none;
border-radius:8px;
cursor:pointer;
background:#ddd;
}

.active{
background:#0a66ff;
color:white;
}

.toolbar{
padding:10px;
background:white;
display:flex;
gap:10px;
flex-wrap:wrap;
position:sticky;
top:0;
z-index:1000;
}

input{
padding:10px;
border-radius:8px;
border:1px solid #ccc;
}

button{
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
}

.cards{
padding:10px;
display:grid;
gap:10px;
}

.card{
background:white;
padding:15px;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,.15);
}

</style>

</head>

<body>

<header>
<h2>INVENTAIRE HDLP</h2>
</header>

<div class="tabs" id="tabs"></div>

<div class="toolbar">

<input
id="search"
placeholder="Recherche produit"
oninput="render()">

<button onclick="scannerCodeBarre()">
📷 Scanner
</button>

<button onclick="exportExcel()">
📤 Export Excel
</button>

</div>

<div id="cards" class="cards"></div>

<script src="app.js"></script>

</body>
</html>
